            -
                label: 🟡 Additional (Shimmering Focus style for hyperlinks)
                value: ssopt-typ-undl-nor-add
            -
                label: 🟢 Maximum (Willemstad style) — Does not cross descenders (the bottom portion of letters "g, j, q, p, y")
