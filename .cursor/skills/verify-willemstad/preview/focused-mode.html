<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Focused mode — Willemstad</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/preview/harness.css">
</head>
<body class="theme-dark">
  <div class="app-container">
    <div class="titlebar"><div class="titlebar-text">Focused</div></div>
    <div class="workspace">
      <div class="side-dock-ribbon" aria-label="ribbon"></div>
      <div class="mod-sidedock" aria-label="file explorer">
        <div class="nav-file-title">Focus.md</div>
        <div class="nav-file-title">Other.md</div>
      </div>
      <div class="workspace-split mod-root">
        <div class="workspace-tabs mod-active">
          <div class="workspace-tab-header-container">
            <div class="workspace-tab-header">Focus.md</div>
            <button type="button" class="sidebar-toggle-button mod-right" aria-label="Toggle right sidebar">
              <span class="clickable-icon">]</span>
            </button>
          </div>
          <div class="workspace-leaf-content" data-type="markdown">
            <div class="view-header">Focus.md</div>
            <div class="view-content markdown-source-view is-live-preview mod-cm6">
              <nav class="verify-nav" aria-label="features">
                <a href="/preview/index.html">Index</a>
                <a href="/preview/focused-mode.html">Normal</a>
                <a href="/preview/focused-mode.html?opt=ssopt-focused-mode">Focused</a>
                <a href="/preview/focused-mode.html?opt=ssopt-super-focused-mode">Super focused</a>
              </nav>
              <div class="cm-editor">
                <div class="cm-scroller">
                  <div class="cm-content">
                    <div class="cm-line">Distant line above</div>
                    <div class="cm-line">Another distant line</div>
                    <div class="cm-line">Near line</div>
                    <div class="cm-line cm-active">The active line stays at full opacity.</div>
                    <div class="cm-line">Near line below</div>
                    <div class="cm-line">Distant line below</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="status-bar">focused-mode</div>
  </div>
  <script type="application/json" id="verify-report">{}</script>
  <script src="/preview/boot.js"></script>
</body>
</html>
